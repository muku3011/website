server:
  port: 8096
  address: 0.0.0.0
  jetty:
    threads:
      max: 20
      min: 4

spring:
  application:
    name: eim-service
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eimdb}
    username: ${SPRING_DATASOURCE_USERNAME:eim}
    password: ${EIM_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    in.hutta.eim: DEBUG

# eIM service integration URLs — override via environment variables in production
eim:
  smdp-url: ${EIM_SMDP_URL:http://127.0.0.1:8092/gsma/rsp/v2/es2plus}
  smdp-address: ${EIM_SMDP_ADDRESS:127.0.0.1:8092}
  ipa-url: ${EIM_IPA_URL:http://127.0.0.1:8097/ipa}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
