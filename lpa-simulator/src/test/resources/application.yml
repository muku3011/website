server:
  port: 8093

spring:
  application:
    name: lpa-simulator
  datasource:
    url: jdbc:h2:mem:lpadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    in.hutta.lpa: DEBUG
