server:
  port: 8093

spring:
  application:
    name: lpa-simulator
  datasource:
    url: jdbc:h2:mem:lpadb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    in.hutta.lpa: DEBUG
