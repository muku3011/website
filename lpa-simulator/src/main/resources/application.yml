server:
  port: 8093
  address: 127.0.0.1

spring:
  application:
    name: lpa-simulator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lpadb}
    username: ${SPRING_DATASOURCE_USERNAME:lpa}
    password: ${LPA_DB_PASSWORD:lpa_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    in.hutta.lpa: DEBUG

smdp:
  hsm:
    enabled: ${SMDP_HSM_ENABLED:false}
    url: ${SMDP_HSM_URL:http://localhost:8096}
    pin: ${SMDP_HSM_PIN:1234}
