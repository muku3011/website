# Sentinel System Monitoring & Alerting Service Configuration
server:
  port: 8095
  address: 127.0.0.1

spring:
  application:
    name: monitor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/monitordb
    username: monitor
    password: ${MONITOR_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

monitor:
  ntfy:
    topic: hutta_rsp_alerts_muku3011
  db:
    host: localhost
    port: 5432
    smdp-password: ${SMDP_DB_PASSWORD:}
    lpa-password: ${LPA_DB_PASSWORD:}
    blog-password: ${BLOG_DB_PASSWORD:}
    monitor-password: ${MONITOR_DB_PASSWORD:}
    keycloak-password: ${KC_DB_PASSWORD:}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

logging:
  level:
    in.hutta.monitor: INFO

