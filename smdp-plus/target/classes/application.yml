server:
  port: 8092

spring:
  application:
    name: smdp-plus
  datasource:
    url: jdbc:h2:mem:smdpdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    in.hutta.smdp: DEBUG
