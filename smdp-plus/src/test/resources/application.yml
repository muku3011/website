server:
  port: 8092

spring:
  application:
    name: smdp-plus
  datasource:
    url: jdbc:h2:mem:smdpdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    in.hutta.smdp: DEBUG

smdp:
  keystore-path: target/smdp-keystore-test.p12
  keystore-password: testpassword

