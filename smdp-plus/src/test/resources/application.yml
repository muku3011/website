server:
  port: 8092

spring:
  application:
    name: smdp-plus
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smdpdb}
    username: ${SPRING_DATASOURCE_USERNAME:smdp}
    password: ${SPRING_DATASOURCE_PASSWORD:smdp_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    in.hutta.smdp: DEBUG

authelia:
  users-file: src/test/resources/users_database_mock.yml
