server:
  port: 8092
  address: 127.0.0.1

spring:
  application:
    name: smdp-plus
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smdpdb}
    username: ${SPRING_DATASOURCE_USERNAME:smdp}
    password: ${SMDP_DB_PASSWORD:smdp_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    in.hutta.smdp: DEBUG

smdp:
  keystore-path: ${SMDP_KEYSTORE_PATH:smdp-keystore.p12}
  keystore-password: ${SMDP_KEYSTORE_PASSWORD:changeit}
  db-encryption-key: ${SMDP_DB_ENCRYPTION_KEY:}
  hsm:
    enabled: ${SMDP_HSM_ENABLED:false}
    url: ${SMDP_HSM_URL:http://localhost:8096}
    pin: ${SMDP_HSM_PIN:1234}



