server:
  port: 8094
  address: 127.0.0.1

spring:
  application:
    name: blog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blogdb}
    username: ${SPRING_DATASOURCE_USERNAME:blog}
    password: ${BLOG_DB_PASSWORD:blog_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    in.hutta.blog: DEBUG

smdp:
  hsm:
    enabled: ${SMDP_HSM_ENABLED:false}
    url: ${SMDP_HSM_URL:http://localhost:8096}
    pin: ${SMDP_HSM_PIN:1234}
