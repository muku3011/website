name: Deploy Blog Service (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'blog-service/**'

jobs:
  deploy:
    uses: ./.github/workflows/deploy-java-template.yml
    with:
      module-name: blog-service
      service-name: blog-service
      jar-name: blog-service-1.0.0.jar
      remote-dir: /home/rbpi/blog-service
      description: "Technology Blog Backend Service"
