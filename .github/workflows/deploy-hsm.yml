name: Deploy HSM Simulator (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'hsm-simulator/**'

jobs:
  deploy:
    uses: ./.github/workflows/deploy-java-template.yml
    with:
      module-name: hsm-simulator
      service-name: hsm-simulator
      jar-name: hsm-simulator-1.0.0.jar
      remote-dir: /home/rbpi/hsm-simulator
      description: "Hutta HSM Simulator Service"
