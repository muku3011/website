name: Deploy HSM Simulator (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'hsm-simulator/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Spring Boot JAR
        run: |
          mvn -pl hsm-simulator -am clean package -DskipTests

      - name: Copy JAR to App Directory
        run: |
          cp hsm-simulator/target/hsm-simulator-1.0.0.jar /home/rbpi/hsm-simulator/hsm-simulator.jar

      - name: Restart HSM Simulator Service
        run: |
          sudo systemctl restart hsm-simulator.service
