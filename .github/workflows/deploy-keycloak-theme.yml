name: Deploy Keycloak Theme (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'keycloak/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Keycloak Theme
        run: |
          KC_THEMES_DIR="/opt/keycloak/themes"
          if [ ! -d "$KC_THEMES_DIR" ]; then
            echo "Error: Keycloak themes directory not found at $KC_THEMES_DIR"
            exit 1
          fi
          sudo cp -r keycloak/hutta "$KC_THEMES_DIR/"
          sudo chown -R keycloak:keycloak "$KC_THEMES_DIR/hutta"
          echo "Theme deployed to $KC_THEMES_DIR/hutta"

      - name: Restart Keycloak
        run: |
          sudo systemctl restart keycloak.service
          echo "Waiting for Keycloak to come back up..."
          sleep 15
          sudo systemctl is-active keycloak.service
