name: Deploy SM-DP+ Server (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'smdp-plus/**'

jobs:
  deploy:
    uses: ./.github/workflows/deploy-java-template.yml
    with:
      module-name: smdp-plus
      service-name: smdp-plus
      jar-name: smdp-plus-1.0.0.jar
      remote-dir: /home/rbpi/smdp-plus
      description: "SM-DP+ eSIM Remote Provisioning Service"
