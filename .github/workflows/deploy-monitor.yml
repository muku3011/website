name: Deploy Monitor Service (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'monitor-service/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Spring Boot JAR
        run: |
          mvn -pl monitor-service clean package -DskipTests

      - name: Ensure App Directory
        run: |
          sudo mkdir -p /home/rbpi/monitor-service
          sudo chown -R rbpi:rbpi /home/rbpi/monitor-service

      - name: Copy JAR to App Directory
        run: |
          cp monitor-service/target/monitor-service-1.0.0.jar /home/rbpi/monitor-service/monitor-service.jar

      - name: Restart Service
        run: |
          sudo systemctl restart monitor-service.service
