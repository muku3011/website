name: Deploy Monitor Service (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'monitor-service/**'

jobs:
  deploy:
    uses: ./.github/workflows/deploy-java-template.yml
    with:
      module-name: monitor-service
      service-name: monitor-service
      jar-name: monitor-service-1.0.0.jar
      remote-dir: /home/rbpi/monitor-service
      description: "Sentinel — System Monitoring & Alerting Service"
