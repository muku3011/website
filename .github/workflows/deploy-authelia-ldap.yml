name: Deploy Authelia LDAP Server (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'authelia-ldap/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Spring Boot JAR
        run: |
          cd authelia-ldap
          mvn clean package -DskipTests

      - name: Copy JAR to App Directory
        run: |
          cp authelia-ldap/target/authelia-ldap-1.0.0.jar /home/rbpi/authelia-ldap/authelia-ldap.jar

      - name: Restart Authelia LDAP Service
        run: |
          sudo systemctl restart authelia-ldap.service
