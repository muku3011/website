name: Deploy eSIM Device Simulator (Self-Hosted)

on:
  push:
    branches:
      - main
    paths:
      - 'device-simulator/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Spring Boot JAR
        run: |
          mvn -pl device-simulator clean package -DskipTests

      - name: Ensure App Directory
        run: |
          sudo mkdir -p /home/rbpi/device-simulator
          sudo chown -R rbpi:rbpi /home/rbpi/device-simulator

      - name: Copy JAR to App Directory
        run: |
          cp device-simulator/target/device-simulator-1.0.0.jar /home/rbpi/device-simulator/device-simulator.jar

      - name: Restart Service
        run: |
          sudo systemctl restart device-simulator.service
