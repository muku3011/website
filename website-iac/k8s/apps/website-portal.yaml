apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-portal
  namespace: default
  labels:
    app: website-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website-portal
  template:
    metadata:
      labels:
        app: website-portal
    spec:
      containers:
      - name: web-app
        image: ghcr.io/muku3011/website/portal:46106b8540bd962c0faf8653ffb10477c3d049cb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website-portal-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: website-portal
  ports:
  - port: 80
    targetPort: 80
