apiVersion: apps/v1
kind: Deployment
metadata:
  name: smdp-plus
  namespace: default
  labels:
    app: smdp-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smdp-plus
  template:
    metadata:
      labels:
        app: smdp-plus
    spec:
      containers:
      - name: smdp-plus
        image: ghcr.io/muku3011/website/smdp-plus:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8092
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/smdpdb"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          value: "https://auth.hutta.in/realms/hutta"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.io.tmpdir=/tmp"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8092
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8092
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8092
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smdp-plus-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: smdp-plus
  ports:
  - port: 8092
    targetPort: 8092
