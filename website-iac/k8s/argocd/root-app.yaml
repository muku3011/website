apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hutta-platform-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/muku3011/website.git'
    targetRevision: HEAD
    path: website-iac/k8s/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
