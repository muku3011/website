apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: kube-system
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.1
        args:
        - "--path.procfs=/host/proc"
        - "--path.sysfs=/host/sys"
        - "--path.rootfs=/host/root"
        - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
        ports:
        - containerPort: 9100
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          readOnly: true
        resources:
          requests:
            memory: "30Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
---
# VictoriaMetrics Single-Node (Ultra Lightweight Time-Series DB, <40MB RAM)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: kube-system
  labels:
    app: victoriametrics
spec:
  serviceName: victoriametrics-service
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
      - name: victoriametrics
        image: victoriametrics/victoria-metrics:v1.101.0
        args:
        - "-storageDataPath=/storage"
        - "-retentionPeriod=14d"
        - "-promscrape.config=/config/scrape.yml"
        ports:
        - containerPort: 8428
        volumeMounts:
        - name: vm-data
          mountPath: /storage
        - name: scrape-config
          mountPath: /config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: scrape-config
        configMap:
          name: victoriametrics-scrape-config
  volumeClaimTemplates:
  - metadata:
      name: vm-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape-config
  namespace: kube-system
data:
  scrape.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # 1. Raspberry Pi Hardware & Temperature Metrics (Node Exporter)
      - job_name: 'node-exporter'
        static_configs:
          - targets:
            - '192.168.1.100:9100'  # rbpi-master
            - '192.168.1.110:9100'  # rbpi-worker-01
            - '192.168.1.120:9100'  # rbpi-worker-02

      # 2. Spring Boot Microservices Micrometer Prometheus Metrics
      - job_name: 'spring-boot-apps'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (smdp-plus|device-simulator|blog-service|eim-service)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics-service
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
  - port: 8428
    targetPort: 8428
