[defaults]
inventory = inventory.ini
host_key_checking = False
pipelining = True
forks = 10
timeout = 30
stdout_callback = default
result_format = yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
