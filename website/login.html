<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hutta.in | Secure Gateway</title>
    <meta name="description" content="Secure access gateway for hutta.in services.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
            overflow: hidden;
        }

        .login-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, hsla(var(--hue-primary), 100%, 60%, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-lg);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 48px var(--shadow-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: var(--transition-smooth);
        }

        .login-card:hover {
            border-color: hsla(var(--hue-primary), 100%, 65%, 0.2);
            box-shadow: 0 24px 64px var(--shadow-color);
        }

        .login-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 1.5rem;
        }

        .login-card h2 {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            background: var(--console-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.85rem 1rem;
            border-radius: var(--border-radius-sm);
            font-family: var(--font-primary);
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .input-field:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 8px rgba(var(--hue-primary), 100%, 60%, 0.25);
        }

        .error-message {
            color: var(--warning-glow);
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 1.25rem;
            margin-top: -0.5rem;
            text-align: left;
        }

        .login-actions {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .btn-login {
            padding: 0.85rem;
            font-size: 0.95rem;
            width: 100%;
        }

        .login-footer-link {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .login-footer-link:hover {
            color: var(--primary-glow);
        }

        /* Float theme toggle at the top right of login screen */
        .login-theme-container {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 10;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="login-theme-container">
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle light and dark theme" title="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-glow"></div>
        <div class="login-card">
            <div class="login-logo"></div>
            <h2>Secure Gateway</h2>
            <p class="login-subtitle">Enter your passcode to access hutta.in dashboard services.</p>
            
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="passcode">Access Passcode</label>
                    <input type="password" id="passcode" class="input-field" placeholder="••••••••" required autocomplete="current-password" autofocus>
                </div>
                
                <div id="error-msg" class="error-message" aria-live="polite"></div>
                
                <div class="login-actions">
                    <button type="submit" class="btn btn-primary btn-login">Verify Access</button>
                    <a href="index.html" class="login-footer-link">Back to Homepage</a>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
